<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>CIRA Fleet Logistics — جاري التحويل</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2216%22 fill=%22%23703845%22/><text y=%2266%22 x=%2250%22 text-anchor=%22middle%22 font-family=%22sans-serif%22 font-weight=%22bold%22 font-size=%2232%22 fill=%22%23CE9F51%22>CIRA</text></svg>">
  <script>
    (function() {
      var session = sessionStorage.getItem('cira_auth_user');
      if (session) {
        try {
          var user = JSON.parse(session);
          if (user && user.role) {
            window.location.replace('home.html');
            return;
          }
        } catch (e) {}
      }
      window.location.replace('login.html');
    })();
  </script>
</head>
<body style="margin:0; background:#F8F6F4; font-family:'Cairo', sans-serif; display:flex; align-items:center; justify-content:center; height:100vh; color:#703845;">
  <div style="text-align:center;">
    <div style="width:48px; height:48px; border:4px solid #CE9F51; border-top-color:#703845; border-radius:50%; animation:spin 0.8s linear infinite; margin:0 auto 16px;"></div>
    <h2 style="margin:0 0 8px; font-size:20px;">منظومة أسطول سيرا للتعليم</h2>
    <p style="margin:0; font-size:14px; color:#5E5A5A;">جاري توجيه جلسة العمل...</p>
  </div>
  <style>
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</body>
</html>
