<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>CIRA Fleet Logistics — Redirecting</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="img/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
  <script>
    (function() {
      if (window.location.search.includes('noredirect=1')) return;
      var session = sessionStorage.getItem('cira_auth_user');
      if (session) {
        try {
          var user = JSON.parse(session);
          if (user && user.role) {
            window.location.replace('home.html');
            return;
          }
        } catch (e) {}
      }
      window.location.replace('login.html');
    })();
  </script>
</head>
<body style="margin:0; background:#F8F6F4; font-family:'Cairo', sans-serif; display:flex; align-items:center; justify-content:center; height:100vh; color:#703845;">
  <div style="text-align:center;">
    <img src="img/cira-logo.png" alt="CIRA Education" style="height:48px; width:auto; margin-bottom:24px; display:inline-block;">
    <div style="width:40px; height:40px; border:3px solid #E2DED9; border-top-color:#703845; border-radius:50%; animation:spin 0.8s linear infinite; margin:0 auto 16px;"></div>
    <h2 style="margin:0 0 6px; font-size:18px; color:#703845; font-weight:700;">Fleet Logistics Directorate</h2>
    <p style="margin:0; font-size:13.5px; color:#5E5A5A;">Redirecting session...</p>
  </div>
  <style>
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</body>
</html>
