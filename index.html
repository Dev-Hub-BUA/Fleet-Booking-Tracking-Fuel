<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>CIRA Fleet Logistics — Redirecting</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
  <script>
    (function() {
      if (window.location.search.includes('noredirect=1')) return;
      var session = sessionStorage.getItem('cira_auth_user');
      if (session) {
        try {
          var user = JSON.parse(session);
          if (user && user.role) {
            window.location.replace('home.html');
            return;
          }
        } catch (e) {}
      }
      window.location.replace('login.html');
    })();
  </script>
</head>
<body style="margin:0; background:#F8F6F4; font-family:'Cairo', sans-serif; display:flex; align-items:center; justify-content:center; height:100vh; color:#703845;">
  <div style="text-align:center;">
    <div style="width:48px; height:48px; border:4px solid #CE9F51; border-top-color:#703845; border-radius:50%; animation:spin 0.8s linear infinite; margin:0 auto 16px;"></div>
    <h2 style="margin:0 0 8px; font-size:20px;">CIRA Education Fleet Logistics</h2>
    <p style="margin:0; font-size:14px; color:#5E5A5A;">Redirecting session...</p>
  </div>
  <style>
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</body>
</html>
